<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eh Sam | Premium Streetwear</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #222;
        }
        header h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
        }
        /* The automatic responsive product grid layout */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: #121212;
            border: 1px solid #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 2px;
            background-color: #222;
        }
        .product-info {
            margin-top: 15px;
        }
        .product-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .product-price {
            color: #888;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .size-selector {
            margin-bottom: 15px;
        }
        .size-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }
        .size-btn {
            background: transparent;
            color: white;
            border: 1px solid #444;
            padding: 5px 12px;
            margin-right: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .size-btn:hover {
            border-color: #fff;
        }
        .buy-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .buy-btn:hover {
            background: #dddddd;
        }
        .loading {
            text-align: center;
            color: #555;
            font-size: 1.2rem;
            grid-column: 1 / -1;
            padding: 50px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>EH SAM</h1>
        <p style="color: #666; font-size: 0.9rem; margin-top: 5px; letter-spacing: 2px;">PREMIUM STORE</p>
    </header>

    <div class="container">
        <div class="product-grid" id="products-grid">
            <div class="loading" id="loading-text">Loading the latest drop...</div>
        </div>
    </div>

    <script>
        async function fetchStoreProducts() {
            const grid = document.getElementById('products-grid');
            const loadingText = document.getElementById('loading-text');

            try {
                // 1. Fetching the list of product files inside your repository folder
                const response = await fetch('https://api.github.com/repos/ehsam211/ehlitestore/contents/products');
                
                if (!response.ok) {
                    throw new Error("Could not fetch product list");
                }
                
                const files = await response.json();
                let productFound = false;

                // Clear the loading indicator
                grid.innerHTML = "";

                // 2. Loop through every single file inside the products folder
                for (let file of files) {
                    if (file.name.endsWith('.json')) {
                        productFound = true;
                        
                        // Fetch individual data profile details for each item
                        const dataResponse = await fetch(file.download_url);
                        const product = await dataResponse.json();

                        // Render the size selections dynamically
                        let sizeHTML = '';
                        if (product.sizes) {
                            // Split string combinations like "M and L" into distinct interface buttons
                            const sizeList = product.sizes.replace(" and ", ",").split(",");
                            sizeHTML = `<span class="size-label">Select Size</span>`;
                            sizeList.forEach(size => {
                                sizeHTML += `<button class="size-btn">${size.trim()}</button>`;
                            });
                        } else {
                            // Standard default buttons backup layout
                            sizeHTML = `
                                <span class="size-label">Select Size</span>
                                <button class="size-btn">M</button>
                                <button class="size-btn">L</button>
                            `;
                        }

                        // 3. Generate individual modern card block structure layouts onto the layout container
                        grid.innerHTML += `
                            <div class="product-card">
                                <img class="product-image" src="${product.image || 'https://via.placeholder.com/350x450?text=No+Image'}" alt="${product.title}">
                                <div class="product-info">
                                    <h3 class="product-title">${product.title}</h3>
                                    <p class="product-price">$${parseFloat(product.price).toFixed(2)}</p>
                                    <div class="size-selector">
                                        ${sizeHTML}
                                    </div>
                                    <button class="buy-btn" onclick="alert('To complete purchase order for ${product.title}, please send payment matching product price to your designated bank layout.')">Buy Now</button>
                                </div>
                            </div>
                        `;
                    }
                }

                if (!productFound) {
                    grid.innerHTML = `<div class="loading">No products found inside your dashboard yet. Add one to see it show up here!</div>`;
                }

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="loading" style="color: #ff4444;">Error launching store layout. Check your product configuration files.</div>`;
            }
        }

        // Run functions instantly upon interface opening
        fetchStoreProducts();
    </script>
</body>
</html>
