backend:
  name: git-gateway
  branch: main # Branch to update (change if your branch is named 'master')

media_folder: "images" # Folder where your uploaded product photos go
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    folder: "products" # The folder where the CMS will save product data files
    create: true
    format: "json"
    fields:
      - {label: "Product Name", name: "title", widget: "string"}
      - {label: "Base Price (USD)", name: "price", widget: "number", value_type: "float"}
      - {label: "Image URL or Upload", name: "image", widget: "image"}
      - {label: "Category", name: "category", widget: "select", options: ["T-Shirts", "Hoodies", "Posters", "Cases"]}