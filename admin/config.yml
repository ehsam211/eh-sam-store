backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    folder: "products"
    create: true
    format: "json"
    fields:
      - {label: "Product Name", name: "title", widget: "string"}
      - {label: "Base Price (USD)", name: "price", widget: "number", value_type: "float"}
      - {label: "Image URL or Upload", name: "image", widget: "image"}
      - {label: "Category", name: "category", widget: "select", options: ["T-Shirts", "Hoodies", "Posters", "Cases"]}
      - {label: "Available Sizes", name: "sizes", widget: "select", options: ["M", "L", "XL", "M and L"]}